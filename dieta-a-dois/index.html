<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dieta a Dois</title>
<meta name="description" content="Contador de calorias do nosso plano alimentar">
<meta name="theme-color" content="#FBF6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dieta a Dois">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6F1;--card:#FFFFFF;--ink:#2E2724;--muted:#8F837D;--line:#F0E7E0;--soft:#F7EFE9;
  --rose:#E2728A;--rose-soft:#FCE6EA;--blue:#3F8CBF;--blue-soft:#E2F0F9;
  --accent:var(--rose);--accent-soft:var(--rose-soft);
  --good:#4FA376;--good-soft:#E3F3EA;--warn:#DA8838;--warn-soft:#FCEBD9;--water:#4AA3DF;--water-soft:#E1F1FB;
  --shadow:0 1px 2px rgba(70,45,30,.04),0 8px 24px rgba(70,45,30,.06);
  --r:22px;
  font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161312;--card:#221E1C;--ink:#F4EDE9;--muted:#A69A94;--line:#332C29;--soft:#2A2421;
  --rose:#F08AA0;--rose-soft:#3B2329;--blue:#6AAEE0;--blue-soft:#1C2B37;
  --good:#6CC292;--good-soft:#1C3126;--warn:#F0A75A;--warn-soft:#3A2B1C;--water:#64B5EC;--water-soft:#1A2C39;
  --shadow:none;color-scheme:dark;
}}
body[data-p="b"]{--accent:var(--blue);--accent-soft:var(--blue-soft)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{min-height:100dvh;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 0;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select{font-size:16px}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:0 0 14px;border:1px solid var(--line)}
@media (prefers-color-scheme:light){.card{border-color:transparent}}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* Cabeçalho */
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 14px}
.top h1{font-size:26px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:19px;font-weight:800;border:2px solid var(--accent)}
.datenav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:6px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.datenav .lbl{font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--soft)}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}

/* Resumo */
.summary{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .big{font-size:28px;font-weight:800;line-height:1}
.ring circle{transition:stroke-dashoffset .5s ease}
.stats{flex:1;display:grid;gap:10px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-weight:800;font-size:18px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s ease}
.bar .range{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink);opacity:.25}
.macro{margin-top:16px}
.macro .row{margin-bottom:6px}

/* Água */
.water .bar>i{background:var(--water)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;background:var(--soft);font-weight:700;font-size:14px;white-space:nowrap}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--accent);color:#fff}
.chip.water{background:var(--water-soft);color:var(--water)}
.chip.done{background:var(--good-soft);color:var(--good)}

/* Refeições */
.meal{padding:14px 16px}
.meal-h{display:flex;align-items:center;gap:12px}
.meal-ico{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.meal-h b{display:block}
.add{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.add:active{transform:scale(.94)}
.entries{margin:6px 0 0 50px}
.entry{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);width:100%;text-align:left}
.entry:first-child{border-top:0}
.entry .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .kc{font-weight:800;white-space:nowrap}
.code{font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--soft);color:var(--muted);margin-right:4px}

/* Barra de navegação */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0}
.tab .i{display:grid;place-items:center;height:24px}
.tab.on{color:var(--accent)}
.tab.on .i svg{stroke-width:2.4}
.fab{justify-self:center;width:58px;height:58px;border-radius:20px;background:var(--accent);color:#fff;display:grid;place-items:center;
  box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent);margin-top:-22px}
.fab:active{transform:scale(.95)}

/* Bottom sheet */
.overlay{cursor:pointer;position:fixed;inset:0;background:rgba(20,12,8,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;
  max-height:86dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sh-head{position:relative;flex:none;height:44px;touch-action:none;cursor:grab}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--muted);opacity:.35;position:absolute;left:50%;top:9px;transform:translateX(-50%)}
.sh-x{position:absolute;right:12px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--muted);display:grid;place-items:center}
.sh-x:active{transform:scale(.92)}
.sheet .sc{overflow-y:auto;overscroll-behavior:contain;padding:0 18px 22px;-webkit-overflow-scrolling:touch}
.sheet h2{font-size:21px;margin:0 0 12px;padding-right:44px}
.search{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--soft);outline:none}
.search:focus,.field:focus{border-color:var(--accent)}
.list{margin-top:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item .t{font-weight:700}
.item .s{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .kc{text-align:right;white-space:nowrap;font-weight:800}
.item .kc small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.sec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 4px 2px}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}

.field{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);outline:none}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;background:var(--accent);color:#fff;font-weight:800;font-size:17px;text-align:center}
.btn:active{transform:scale(.99);filter:brightness(.96)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btns{display:grid;gap:10px;margin-top:14px}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 6px}
.stepper button{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:28px;font-weight:800}
.stepper input{width:110px;text-align:center;font-size:28px;font-weight:800;border:0;background:none;outline:none}
.preview{display:flex;justify-content:center;gap:26px;padding:14px;border-radius:18px;background:var(--soft);margin:12px 0}
.preview div{text-align:center}
.preview b{display:block;font-size:24px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.seg button{padding:11px 0;border-radius:12px;background:var(--soft);color:var(--muted);display:grid;place-items:center}
.seg button.on{background:var(--accent);color:#fff}
.seg-l{text-align:center;font-size:13px;font-weight:700;color:var(--muted);margin-top:6px}

/* Progresso */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.kpi{background:var(--soft);border-radius:16px;padding:12px;text-align:center}
.kpi b{display:block;font-size:19px}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
svg text{fill:var(--muted);font-size:11px;font-family:inherit;font-weight:700}
.wlist .entry{padding:9px 2px}
.tip{background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14px}
.tip.warn{background:var(--warn-soft)}

/* Plano */
table.week{width:100%;border-collapse:collapse;font-size:14px}
table.week th{font-size:12px;color:var(--muted);text-align:left;padding:6px 4px}
table.week td{padding:9px 4px;border-top:1px solid var(--line);font-weight:700}
table.week tr.today td{color:var(--accent)}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{list-style:none;padding:14px 2px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"›";font-size:22px;color:var(--muted);transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
details .body{padding:0 2px 14px;font-size:15px;color:var(--ink)}
details ul{margin:0;padding-left:20px}
details li{margin-bottom:6px}

/* Boas-vindas */
.welcome{min-height:90dvh;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.who{display:flex;align-items:center;gap:14px;text-align:left;padding:18px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;width:100%}
.who .avatar{width:56px;height:56px;font-size:23px}

.toast{display:flex;align-items:center;gap:8px;position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
/* Hoje (versão limpa) */
.top .hi{font-size:14px;color:var(--muted);font-weight:700;margin-left:2px}
.dnav{display:flex;align-items:center;margin-left:-8px}
.dnav h1{font-size:28px;padding:0 4px}
.iconbtn.sm{width:32px;height:32px;border-radius:10px}
.hero .summary{gap:16px}
.hero .ring{width:120px;height:120px}
.hero .ring .big{font-size:26px}
.hero .stats{gap:12px}
.hero .v small{font-size:13px;color:var(--muted);font-weight:700}
.mstat .row{font-size:13px;margin-bottom:5px}
.mstat .ttl{gap:6px;font-weight:700}
.bar.thin{height:7px}
.mstat.water .bar>i{background:var(--water)}
.mstat.water .ttl .ico{color:var(--water)}
.hero-foot{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.hero-foot .chip{padding:8px 13px}
.sec.h{margin:20px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec.h span{text-transform:none;letter-spacing:0;font-weight:700}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.sug{flex:none;scroll-snap-align:start;width:148px;min-height:86px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 13px;
  border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;font-weight:700;font-size:14px;line-height:1.25}
.sug .top2{display:flex;width:100%;justify-content:space-between;align-items:center}
.sug .k{font-size:12px;color:var(--muted);font-weight:700}
.sug.done{background:var(--good-soft);border-color:transparent}
.sug.done .ico{color:var(--good)}
.meals{padding:2px 16px}
.mrow{padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .entry{padding:8px 0}
/* Gaveta de adicionar */
.mealpick{position:relative;display:flex;align-items:center;gap:10px;margin:0 0 12px;padding-right:44px}
.mealpick select{appearance:none;-webkit-appearance:none;border:0;background:none;font-size:21px;font-weight:800;padding:2px 26px 2px 0;outline:none;color:var(--ink);cursor:pointer}
.mealpick>.ico:last-child{margin-left:-28px;pointer-events:none;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:15px;background:var(--soft);margin-bottom:12px}
.modes button{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;border-radius:11px;font-size:14px;font-weight:800;color:var(--muted)}
.modes button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.modes button.on .ico{color:var(--accent)}
/* Introdução */
#intro{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 18px);animation:fadein .25s ease}
#intro.out{opacity:0;transition:opacity .25s}
@keyframes fadein{from{opacity:0}}
.in-top{display:flex;justify-content:space-between;align-items:center;padding:0 16px 0 22px;height:44px}
.link{color:var(--accent);font-weight:800;padding:8px 6px}
.in-view{flex:1;overflow:hidden;touch-action:pan-y}
.in-track{display:flex;height:100%;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.in-slide{flex:0 0 100%;display:flex;align-items:center;justify-content:center;padding:0 26px}
.in-in{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;text-align:center}
.in-art{width:100%;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin-bottom:26px}
.in-in h2{font-size:26px;margin:0 0 10px}
.in-in p{color:var(--muted);font-size:16.5px;line-height:1.5;margin:0}
.in-in p b{color:var(--ink)}
.in-dots{display:flex;justify-content:center;gap:7px;margin:8px 0 18px}
.in-dots i{width:7px;height:7px;border-radius:9px;background:var(--line);transition:all .25s}
.in-dots i.on{width:22px;background:var(--accent)}
.in-btns{display:flex;gap:10px;padding:0 20px;width:100%;max-width:520px;margin:0 auto}
.in-btns .btn{flex:1}
.mock{width:100%;background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);text-align:left}
.mock .entry{border:0}
.fakesearch{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:14px;background:var(--soft);color:var(--muted);font-weight:700;margin-bottom:6px}
.fakesearch b{color:var(--ink)}
.bigfab{width:62px;height:62px;border-radius:21px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.bigcheck{width:96px;height:96px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center}
.tapdot{width:26px;height:26px;border-radius:50%;background:var(--accent);opacity:.35;animation:pulse 1.4s ease-in-out infinite;flex:none}
.arrowtxt{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;font-size:14px}
.empty .ico{display:block;margin:0 auto 8px;opacity:.6}
.ico{flex:none;display:inline-block;vertical-align:middle}
.ttl{display:inline-flex;align-items:center;gap:9px;font-weight:800}
.ttl .ico{color:var(--accent)}
.water .ttl .ico{color:var(--water)}
.tip{display:flex;gap:10px;align-items:flex-start}
.tip .ico{margin-top:1px;color:var(--accent)}
.tip.warn .ico{color:var(--warn)}
summary .ttl .ico{color:var(--accent)}
.del{color:var(--muted);display:grid;place-items:center;padding:2px}
.logo{width:84px;height:84px;border-radius:24px;margin:0 auto 4px;box-shadow:0 10px 30px rgba(226,114,138,.35)}
.calcbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px}
.calcbtn b{display:block}
textarea.field{resize:vertical;min-height:110px;line-height:1.45}
.crow{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.crow .t{font-weight:700}
.crow.unk .sel{padding:9px 10px;margin-bottom:4px;border-color:var(--warn)}
.gq{display:flex;align-items:center;gap:3px;background:var(--soft);border-radius:12px;padding:0 8px 0 0}
.gq input{width:58px;border:0;background:none;text-align:right;font-weight:800;padding:9px 2px;outline:none}
.gq span{font-size:13px;color:var(--muted);font-weight:700}
.ck{width:54px;text-align:right;font-weight:800;line-height:1.1}
.ck small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.crow .x{color:var(--muted);padding:6px 2px 6px 4px;font-size:14px}
.mini{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--muted);vertical-align:2px;margin-left:4px}
.mini.on{background:var(--warn-soft);color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden>
  <div class="in">
    <button class="tab" data-a="tab" data-v="hoje"><span class="i" data-ic="home"></span>Hoje</button>

const DAYNAMES = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

/* ================= Estado ================= */
const KEY = 'dieta-a-dois:v1';
function defaults(){
  return {
    v:1, active:null,
    profiles:{
      a:{name:'Zélia',kcal:1750,pmin:115,pmax:130,water:2500,start:100,goal:72,rate:'~0,5 kg/semana',maxRate:1},
      b:{name:'Namorado',kcal:2350,pmin:150,pmax:180,water:3500,start:137,goal:127,rate:'~0,7 a 1 kg/semana',maxRate:1.2},
    },
    days:{}, weights:{a:[],b:[{d:'2026-11-25',kg:137}]}, custom:[], recent:{a:[],b:[]},
  };
}
let S = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.profiles) return Object.assign(defaults(), s); }catch(e){}
  return defaults();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Não consegui salvar',false); } }

const UI = {view:'hoje', date:todayKey(), lastToday:todayKey(), addCat:'tudo', addQuery:'', addMeal:null};

/* ================= Utilitários ================= */
function todayKey(d=new Date()){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return todayKey(d); }
function fmtDate(k,opt={weekday:'long',day:'numeric',month:'short'}){ return parseKey(k).toLocaleDateString('pt-BR',opt); }
const nf = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});
const fmt = n => nf.format(Math.round(n*10)/10);
const R = n => Math.round(n).toLocaleString('pt-BR');
const h = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const initial = n => h((n||'?').trim().charAt(0).toUpperCase());
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const P = () => S.active==='b'?1:0;
const prof = () => S.profiles[S.active];
const isMass = u => u==='g'||u==='ml';
function day(k=UI.date, p=S.active){ const id=p+'|'+k; return S.days[id] || (S.days[id]={items:[],water:0}); }
function peekDay(k, p=S.active){ return S.days[p+'|'+k]; }
function totals(dd){ let k=0,p=0; (dd?.items||[]).forEach(e=>{k+=e.k1*e.qty;p+=e.p1*e.qty}); return {k,p}; }
function qtyLabel(e){ if(isMass(e.unit)) return `${fmt(e.qty)} ${e.unit}`; if(e.unit==='porção') return e.qty===1?'1 porção':`${fmt(e.qty)} porções`; return `${fmt(e.qty)} ${e.unit}`; }
function guessMeal(){ const hr=new Date().getHours(); return hr<10?'cafe':hr<15?'almoco':hr<18?'lanche':hr<21?'jantar':'ceia'; }
function toast(msg, ok=true){ const t=document.getElementById('toast'); t.innerHTML=ic(ok?'check':'alert',17)+'<span>'+h(msg)+'</span>'; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1800); }
function buzz(){ try{ navigator.vibrate && navigator.vibrate(8); }catch(e){} }

function catalog(){
  const pi=P(), items=[];
  PLAN.forEach((o,i)=>items.push({key:'p:'+i,cat:o.m==='ceia'||o.c==='D'?'doce':'plano',code:o.c==='D'?'':o.c,meal:o.m,name:o.n,sub:o.d[pi],unit:'porção',step:.5,k1:o.k[pi],p1:o.p[pi],def:1}));
  FOODS.forEach(f=>{ const per=isMass(f.u)?100:1; items.push({key:'f:'+f.id,cat:f.cat||'alimento',name:f.n,sub:f.h||'',unit:f.u,step:isMass(f.u)?10:.5,k1:f.k/per,p1:f.p/per,def:f.d[pi]}); });
  S.custom.forEach(c=>items.push({key:'c:'+c.id,cat:'meus',name:c.name,sub:c.unit==='g'?'valores por 100 g':'',unit:c.unit,step:c.unit==='g'?10:.5,k1:c.k1,p1:c.p1,def:c.def}));
  return items;
}
const findItem = key => catalog().find(i=>i.key===key);
const planItem = code => catalog().find(i=>i.key.startsWith('p:') && i.code===code && !PLAN[+i.key.slice(2)].alt);

/* ================= Telas ================= */
function render(){
  const app=document.getElementById('app'), tabs=document.getElementById('tabs');
  document.body.dataset.p = S.active||'a';
  if(!S.active){ tabs.hidden=true; app.innerHTML=viewWelcome(); return; }
  tabs.hidden=false;
  tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===UI.view));
  app.innerHTML = ({hoje:viewHoje,progresso:viewProgresso,plano:viewPlano,ajustes:viewAjustes})[UI.view]();
}

function header(title){
  const pr=prof();
  return `<div class="top"><div><div class="muted small">${h(title)}</div><h1>Oi, ${h(pr.name)}</h1></div>
    <button class="avatar" data-a="switchProfile" aria-label="Trocar perfil">${initial(pr.name)}</button></div>`;
}

function viewWelcome(){
  const card = id => { const p=S.profiles[id]; return `<button class="who" data-a="pick" data-v="${id}" style="--accent:var(--${id==='a'?'rose':'blue'});--accent-soft:var(--${id==='a'?'rose':'blue'}-soft)">
    <span class="avatar">${initial(p.name)}</span><span class="grow"><b style="font-size:19px">${h(p.name)}</b><br><span class="muted small">Meta: ~${R(p.kcal)} kcal · ${p.pmin}–${p.pmax} g proteína</span></span></button>`; };
  return `<div class="welcome"><img class="logo" src="icons/icon-192.png" alt=""><h1 style="font-size:30px">Dieta a Dois</h1>
    <p class="muted" style="margin:0 0 10px">Quem vai usar este celular?</p>${card('a')}${card('b')}
    <p class="muted small" style="margin-top:12px">Dá pra trocar depois tocando no seu avatar.</p></div>`;
}

function viewHoje(){
  const pr=prof(), dd=peekDay(UI.date)||{items:[],water:0}, t=totals(dd), goal=pr.kcal;
  const left=goal-t.k, pct=Math.min(t.k/goal,1), over=left<0, C=2*Math.PI*50;
  const isToday=UI.date===todayKey(), dow=parseKey(UI.date).getDay();
  const pPct=Math.min(t.p/pr.pmin,1)*100, wPct=Math.min(dd.water/pr.water,1)*100;
  const doneCodes=new Set(dd.items.map(e=>e.code).filter(Boolean));
  const sug=WEEK[dow].map((c,i)=>{
    const m=['cafe','almoco','lanche','jantar'][i], ml=MEALS.find(x=>x.id===m).label.split(' ')[0];
    if(c==='LIVRE') return `<button class="sug" data-a="openAdd" data-meal="almoco" data-cat="livre"><span class="top2"><span class="k">${ml}</span>${ic('pizza',16)}</span>Refeição livre</button>`;
    const it=planItem(c), done=doneCodes.has(c);
    return `<button class="sug ${done?'done':''}" data-a="openItem" data-key="${it.key}" data-meal="${m}"><span class="top2"><span class="k">${ml} · ${c}</span>${done?ic('check',16):`<span class="k">${R(it.k1)}</span>`}</span>${h(it.name)}</button>`;
  }).join('');

  const meals=MEALS.map(m=>{
    const its=dd.items.filter(e=>e.meal===m.id), mk=its.reduce((s,e)=>s+e.k1*e.qty,0);
    return `<div class="mrow"><div class="meal-h"><div class="meal-ico">${ic(m.ico,18)}</div>
      <div class="grow"><b>${m.label}</b><span class="muted small">${its.length?`${R(mk)} kcal`:`sugestão ~${m.t[P()]} kcal`}</span></div>
      <button class="add" data-a="openAdd" data-meal="${m.id}" aria-label="Adicionar em ${m.label}">${ic('plus',19)}</button></div>
      ${its.length?`<div class="entries">${its.map(e=>`<button class="entry" data-a="editEntry" data-id="${e.id}">
        <div class="grow"><div class="n">${h(e.name)}</div><div class="muted small">${qtyLabel(e)}</div></div>
        <div class="kc">${R(e.k1*e.qty)}</div></button>`).join('')}</div>`:''}</div>`;
  }).join('');

  const dlbl = isToday ? 'Hoje' : cap(fmtDate(UI.date,{weekday:'short',day:'numeric',month:'short'})).replace('.,',',');
  return `<div class="top"><div class="grow"><div class="hi">Oi, ${h(pr.name)}</div>
      <div class="dnav"><button class="iconbtn sm" data-a="day" data-v="-1" aria-label="Dia anterior">${ic('chevL',20)}</button>
        <button data-a="goToday"><h1>${dlbl}</h1></button>
        ${isToday?'':`<button class="iconbtn sm" data-a="day" data-v="1" aria-label="Próximo dia">${ic('chevR',20)}</button>`}</div></div>
    <button class="avatar" data-a="switchProfile" aria-label="Trocar perfil">${initial(pr.name)}</button></div>

  <div class="card hero"><div class="summary">
    <div class="ring"><svg width="120" height="120" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="50" fill="none" stroke="var(--soft)" stroke-width="12"/>
      <circle cx="60" cy="60" r="50" fill="none" stroke="${over?'var(--warn)':'var(--accent)'}" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>
      <div class="c"><div><div class="big" style="color:${over?'var(--warn)':'inherit'}">${R(Math.abs(left))}</div><div class="muted small">${over?'kcal acima':'kcal restantes'}</div></div></div></div>
    <div class="stats">
      <div class="stat"><div class="k">Comido hoje</div><div class="v">${R(t.k)} <small>de ${R(goal)}</small></div></div>
      <div class="mstat"><div class="row between"><span class="ttl">${ic('dumbbell',15)}Proteína</span><span><b>${R(t.p)}</b><span class="muted">/${pr.pmin} g</span></span></div>
        <div class="bar thin"><i style="width:${pPct}%;background:${t.p>=pr.pmin?'var(--good)':'var(--accent)'}"></i></div></div>
      <div class="mstat water"><div class="row between"><span class="ttl">${ic('droplet',15)}Água</span><span><b>${fmt(dd.water/1000)}</b><span class="muted">/${fmt(pr.water/1000)} L</span></span></div>
        <div class="bar thin"><i style="width:${wPct}%"></i></div></div>
    </div></div>
    <div class="hero-foot"><span class="muted small grow">Bebeu água?</span>
      <button class="chip" data-a="water" data-v="-250" aria-label="Tirar um copo">−</button>
      <button class="chip water" data-a="water" data-v="250">${ic('plus',15)}1 copo</button></div>
  </div>

  <div class="sec h">Sugestões do plano <span>${DAYNAMES[dow].toLowerCase()}</span></div>
  <div class="hscroll">${sug}</div>

  <div class="sec h">Refeições <span>${R(t.k)} kcal</span></div>
  <div class="card meals">${meals}</div>`;
}

function viewProgresso(){
  const pr=prof(), W=[...S.weights[S.active]].sort((a,b)=>a.d.localeCompare(b.d));
  const cur = W.length?W[W.length-1].kg:pr.start, lost = pr.start-cur;
  const span = pr.start-pr.goal, gp = span>0?Math.max(0,Math.min(1,lost/span)):0;
  let rateTip='';
  if(W.length>=2){
    const first=W[0], last=W[W.length-1], days=(parseKey(last.d)-parseKey(first.d))/864e5;
    if(days>=7){ const r=(first.kg-last.kg)/(days/7);
      rateTip = r>pr.maxRate ? `<div class="tip warn" style="margin-top:12px">${ic('alert',18)}<span>Ritmo de ${fmt(r)} kg/semana — mais rápido que o ideal. O plano sugere aumentar um pouco a comida (arroz/batata).</span></div>`
        : r<0.2 ? `<div class="tip" style="margin-top:12px">${ic('bulb',18)}<span>Ritmo de ${fmt(r)} kg/semana. Se seguir assim por 2–3 semanas, o plano sugere reduzir um pouco o arroz e a batata.</span></div>`
        : `<div class="tip" style="margin-top:12px">${ic('sparkles',18)}<span>Ritmo de ${fmt(r)} kg/semana — dentro do esperado (${pr.rate}). Continua assim!</span></div>`; }
  }
  // últimos 7 dias
  const days=[...Array(7)].map((_,i)=>addDays(todayKey(),i-6));
  const vals=days.map(d=>{const dd=peekDay(d); return {d, ...totals(dd), has:!!(dd&&dd.items.length)}});
  const logged=vals.filter(v=>v.has), avgK=logged.length?logged.reduce((s,v)=>s+v.k,0)/logged.length:0, avgP=logged.length?logged.reduce((s,v)=>s+v.p,0)/logged.length:0;
  const inGoal=logged.filter(v=>v.k<=pr.kcal*1.05).length;
  let streak=0; for(let k=todayKey(), first=true;;first=false){ const dd=peekDay(k); if(dd&&dd.items.length){streak++;k=addDays(k,-1);} else if(first){k=addDays(k,-1);} else break; }

  return `${header('Progresso')}
  <div class="card"><div class="row between"><div><div class="muted small">Peso atual</div><div style="font-size:34px;font-weight:800">${fmt(cur)} kg</div></div>
    <div style="text-align:right"><div class="muted small">Desde o início</div><div style="font-size:22px;font-weight:800;color:${lost>0?'var(--good)':'var(--ink)'}">${lost>0?'−':''}${fmt(Math.abs(lost))} kg</div></div></div>
    <div style="margin-top:14px"><div class="row between small muted" style="margin-bottom:6px"><span>Início ${fmt(pr.start)} kg</span><span>Meta ${fmt(pr.goal)} kg</span></div>
    <div class="bar"><i style="width:${gp*100}%;background:var(--good)"></i></div>
    <div class="small muted" style="margin-top:6px">${span>0?`${R(gp*100)}% do caminho · faltam ${fmt(Math.max(0,cur-pr.goal))} kg`:''}</div></div>
    ${weightChart(W,pr)}${rateTip}
    <div class="row" style="margin-top:14px"><input class="field" id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="Peso de hoje (kg)" style="flex:1">
      <button class="btn" style="width:auto;padding:13px 18px" data-a="addWeight">Salvar</button></div>
    <p class="muted small" style="margin:8px 4px 0">Dica: pese-se sempre no mesmo horário (de manhã, em jejum).</p>
    ${W.length?`<div class="wlist" style="margin-top:8px">${W.slice(-6).reverse().map(w=>`<button class="entry" data-a="delWeight" data-v="${w.d}"><span class="grow">${fmtDate(w.d,{day:'numeric',month:'short',year:'numeric'})}</span><b>${fmt(w.kg)} kg</b><span class="del">${ic('x',16)}</span></button>`).join('')}</div>`:''}
  </div>

  <div class="card"><b class="ttl">${ic('flame',19)}Últimos 7 dias</b>${kcalChart(vals,pr.kcal)}
    <div class="kpis"><div class="kpi"><b>${logged.length?R(avgK):'–'}</b><span>kcal/dia</span></div>
      <div class="kpi"><b>${logged.length?R(avgP):'–'} g</b><span>proteína/dia</span></div>
      <div class="kpi"><b>${streak}</b><span>dias seguidos</span></div></div>
    <p class="muted small" style="margin:10px 4px 0">${logged.length?`Dentro da meta em ${inGoal} de ${logged.length} dias registrados.`:'Registre suas refeições pra ver o gráfico.'}</p></div>`;
}

function weightChart(W,pr){
  if(W.length<2) return `<p class="muted small" style="margin:12px 4px 0">${W.length?'Registre mais um peso pra ver o gráfico.':'Registre seu peso pra acompanhar a evolução.'}</p>`;
  const w=320,hh=150,pl=34,pr_=10,pt=12,pb=22;
  const t0=parseKey(W[0].d).getTime(), t1=parseKey(W[W.length-1].d).getTime()||t0+1;
  const ks=W.map(x=>x.kg); let lo=Math.min(...ks), hi=Math.max(...ks); if(hi-lo<2){lo-=1;hi+=1;} lo=Math.floor(lo); hi=Math.ceil(hi);
  const X=t=>pl+(t1===t0?0:(t-t0)/(t1-t0))*(w-pl-pr_), Y=v=>pt+(hi-v)/(hi-lo)*(hh-pt-pb);
  const pts=W.map(x=>[X(parseKey(x.d).getTime()),Y(x.kg)]);
  const goalLine = pr.goal>=lo&&pr.goal<=hi?`<line x1="${pl}" x2="${w-pr_}" y1="${Y(pr.goal)}" y2="${Y(pr.goal)}" stroke="var(--good)" stroke-dasharray="4 4"/>`:'';
  return `<svg viewBox="0 0 ${w} ${hh}" width="100%" style="margin-top:14px;display:block">
    ${[hi,(hi+lo)/2,lo].map(v=>`<line x1="${pl}" x2="${w-pr_}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`).join('')}
    ${goalLine}
    <path d="M${pts.map(p=>p.join(',')).join(' L')} L${pts[pts.length-1][0]},${hh-pb} L${pts[0][0]},${hh-pb} Z" fill="var(--accent)" opacity=".1"/>
    <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    <text x="${pl}" y="${hh-4}">${fmtDate(W[0].d,{day:'numeric',month:'short'})}</text>
    <text x="${w-pr_}" y="${hh-4}" text-anchor="end">${fmtDate(W[W.length-1].d,{day:'numeric',month:'short'})}</text></svg>`;
}

function kcalChart(vals,goal){
  const w=320,hh=150,pt=10,pb=22,max=Math.max(goal*1.25,...vals.map(v=>v.k)), bw=(w-20)/7;
  const Y=v=>pt+(1-v/max)*(hh-pt-pb);
  return `<svg viewBox="0 0 ${w} ${hh}" width="100%" style="margin-top:12px;display:block">
    ${vals.map((v,i)=>{const x=10+i*bw+bw*.18, bh=(hh-pt-pb)-(Y(v.k)-pt), col=v.k>goal*1.05?'var(--warn)':'var(--accent)';
      return `<rect x="${x}" y="${Y(v.k)}" width="${bw*.64}" height="${Math.max(bh,v.has?3:0)}" rx="7" fill="${col}" opacity="${v.has?1:.25}"/>
      <text x="${x+bw*.32}" y="${hh-6}" text-anchor="middle">${fmtDate(v.d,{weekday:'short'}).slice(0,3)}</text>`}).join('')}

/* ================= Sheet (gaveta de baixo) ================= */
const sheet=document.getElementById('sheet'), overlay=document.getElementById('overlay'), body_=document.getElementById('sheetBody');
let sheetOpen=false;
function openSheet(html, after){
  body_.innerHTML=html; body_.scrollTop=0;
  if(!sheetOpen){ sheetOpen=true; history.pushState({sheet:1},''); }
  sheet.style.transform=''; overlay.style.opacity='';
  requestAnimationFrame(()=>{ sheet.classList.add('on'); overlay.classList.add('on'); });
  after && after();
}
function closeSheet(fromPop){
  if(!sheetOpen) return; sheetOpen=false;
  sheet.classList.remove('on'); overlay.classList.remove('on');
  sheet.style.transform=''; overlay.style.opacity='';
  document.activeElement && document.activeElement.blur();
  if(!fromPop) history.back();
}
addEventListener('popstate',()=>closeSheet(true));
// Tocar fora fecha (listener direto: o Safari do iPhone não repassa toque em <div> pra página)
overlay.addEventListener('click',()=>closeSheet());
// Arrastar pra baixo fecha: pela alça, ou pelo conteúdo quando ele já está no topo
(()=>{
  let y0=null, dy=0, t0=0, dragging=false, fromHead=false;
  sheet.addEventListener('touchstart',e=>{
    if(!sheetOpen||e.touches.length>1){ y0=null; return; }
    const tg=e.target; fromHead=!!tg.closest('.sh-head');
    if(!fromHead && (tg.closest('input,textarea,select,.hscroll') || body_.scrollTop>0)){ y0=null; return; }
    y0=e.touches[0].clientY; dy=0; t0=Date.now(); dragging=false;
  },{passive:true});
  sheet.addEventListener('touchmove',e=>{
    if(y0===null) return;
    const d=e.touches[0].clientY-y0;
    if(!dragging){
      if(d>6 && (fromHead||body_.scrollTop<=0)){ dragging=true; sheet.style.transition='none'; overlay.style.transition='none'; }
      else { if(d<-6) y0=null; return; }
    }
    dy=Math.max(0,d);
    sheet.style.transform=`translateY(${dy}px)`;
    overlay.style.opacity=String(Math.max(0,1-dy/(sheet.offsetHeight||500)));
    e.preventDefault();
  },{passive:false});
  const end=()=>{
    if(y0===null) return; y0=null;
    if(!dragging) return; dragging=false;
    const v=dy/Math.max(1,Date.now()-t0);
    sheet.style.transition=''; overlay.style.transition='';
    if(dy>110 || (dy>40 && v>.5)) closeSheet();
    else { sheet.style.transform=''; overlay.style.opacity=''; }
  };
  sheet.addEventListener('touchend',end); sheet.addEventListener('touchcancel',end);
})();

function renderResults(){
  const el=document.getElementById('results'); if(!el) return;
  const qEl=document.getElementById('q'); if(qEl) qEl.hidden = UI.addCat==='calc'||UI.addCat==='rapido';
  if(UI.addCat==='calc'){ el.innerHTML=calcForm(); if(CALC.rows&&CALC.rows.length) calcTotals(); return; }
  if(UI.addCat==='rapido'){ el.innerHTML=quickForm(); return; }
  const q=norm(UI.addQuery.trim()), items=catalog();
  const sec=(title,list)=>list.length?`<div class="sec">${title}</div>${list.map(itemRow).join('')}`:'';
  if(UI.addCat==='livre' && !q){ el.innerHTML=sec('Refeição livre',items.filter(i=>i.cat==='livre')); return; }
  if(q){
    const score=i=>{ const n=norm(i.name); return norm(i.code)===q?0 : n.startsWith(q)?1 : n.includes(q)?2 : 3; };
    const found=items.filter(i=>norm(i.name+' '+i.code+' '+i.sub).includes(q)).sort((a,b)=>score(a)-score(b));
    el.innerHTML = found.length ? `<div class="list">${found.map(itemRow).join('')}</div>`
      : `<div class="empty">${ic('search',30)}Não achei “${h(UI.addQuery)}”<br><button class="chip on" style="margin-top:12px" data-a="cat" data-v="rapido">Lançar manualmente</button></div>`;
    return;
  }
  const meal=MEALS.find(x=>x.id===UI.addMeal);
  const rec=(S.recent[S.active]||[]).map(findItem).filter(Boolean);
  el.innerHTML = sec('Recentes',rec)
    + sec('Do plano · '+meal.label,items.filter(i=>i.meal===UI.addMeal&&i.key.startsWith('p:')))
    + sec('Meus alimentos',items.filter(i=>i.cat==='meus'))
    + sec('Alimentos',items.filter(i=>i.cat==='alimento'))
    + (UI.addMeal!=='ceia'?sec('Docinhos',items.filter(i=>i.cat==='doce'&&i.meal==='ceia')):'')
    + sec('Refeição livre',items.filter(i=>i.cat==='livre'));
}

const A = {
  pick(t){ S.active=t.dataset.v; save(); UI.view = UI.view||'hoje'; render(); scrollTo(0,0); if(!S.introSeen) showIntro(); },

    openSheet(`<h2>Quem está usando?</h2>${['a','b'].map(id=>{const p=S.profiles[id];return `<button class="who" style="margin-bottom:10px;border-color:${S.active===id?'var(--accent)':'transparent'}" data-a="pickClose" data-v="${id}"><span class="avatar">${initial(p.name)}</span><b class="grow">${h(p.name)}</b>${S.active===id?ic('check',20):''}</button>`}).join('')}`);
  },
  pickClose(t){ closeSheet(); A.pick(t); },
  tab(t){ UI.view=t.dataset.v; render(); scrollTo(0,0); },
  day(t){ UI.date=addDays(UI.date,+t.dataset.v); render(); },
  goToday(){ UI.date=todayKey(); render(); },
  water(t){ const dd=day(); dd.water=Math.max(0,dd.water+ +t.dataset.v); save(); buzz(); render(); if(+t.dataset.v>0 && dd.water>=prof().water && dd.water- +t.dataset.v<prof().water) toast('Meta de água batida!'); },
  openAdd(t){ UI.addMeal=t.dataset.meal||guessMeal(); UI.addCat=t.dataset.cat||'tudo'; UI.addQuery=''; addSheet(); },
  cat(t){ UI.addCat=t.dataset.v; document.querySelectorAll('.modes button').forEach(c=>c.classList.toggle('on',c.dataset.v===UI.addCat)); renderResults(); },
  openItem(t){ const it=findItem(t.dataset.key); if(!it) return; const meal=t.dataset.meal||UI.addMeal||it.meal||guessMeal(); itemSheet(it,{qty:it.def,meal}); },
  step(t){ const c=sheet._ctx; c.qty=Math.max(0,Math.round((c.qty+ +t.dataset.v*c.it.step)*100)/100); buzz(); },
  meal(t){ const c=sheet._ctx; c.meal=t.dataset.v; document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===c.meal)); document.getElementById('ml').textContent=MEALS.find(m=>m.id===c.meal).label; },

  editEntry(t){
    const e=day().items.find(x=>x.id===t.dataset.id); if(!e) return;
    const it=findItem(e.key)||{key:e.key,name:e.name,code:e.code,unit:e.unit,k1:e.k1,p1:e.p1,step:isMass(e.unit)?10:.5,sub:''};
    // mantém os valores salvos na entrada (caso a meta/perfil mude depois)
    itemSheet({...it,k1:e.k1,p1:e.p1,unit:e.unit},{qty:e.qty,meal:e.meal,entryId:e.id});
  },
  saveEntry(){ const c=sheet._ctx, e=day().items.find(x=>x.id===c.entryId); if(e){ if(c.qty<=0) return A.delEntry(); e.qty=c.qty; e.meal=c.meal; save(); } closeSheet(); render(); },
  delEntry(){ const c=sheet._ctx, dd=day(); dd.items=dd.items.filter(x=>x.id!==c.entryId); save(); closeSheet(); render(); toast('Removido'); },
  dupEntry(){ const c=sheet._ctx; addEntry(c.it,c.qty,c.meal,todayKey()); closeSheet(); render(); toast('Copiado pra hoje'); },
  quickAdd(){
    const n=document.getElementById('qn').value.trim()||'Lanche avulso', k=parseFloat(document.getElementById('qk').value.replace(',','.'))||0, p=parseFloat(document.getElementById('qp').value.replace(',','.'))||0;
    const unit=document.getElementById('qu').value, g=parseFloat(document.getElementById('qg').value.replace(',','.'))||100, keep=document.getElementById('qs').checked;
    if(!k) return toast('Coloque as calorias',false);
    const per=unit==='g'?100:1, qty=unit==='g'?g:1;
    let it={key:'q:'+uid(),name:n,unit,k1:k/per,p1:p/per,code:''};
    if(keep){ const c={id:uid(),name:n,unit,k1:k/per,p1:p/per,def:qty}; S.custom.push(c); it={...it,key:'c:'+c.id}; }
    addEntry(it,qty,UI.addMeal); closeSheet(); render(); toast(`Adicionado: ${R(k/per*qty)} kcal`);
  },
  addWeight(){
    const v=parseFloat(document.getElementById('wIn').value.replace(',','.'));
    if(!(v>20&&v<400)) return toast('Peso inválido',false);
    const W=S.weights[S.active], k=todayKey(), ex=W.find(w=>w.d===k); ex?ex.kg=v:W.push({d:k,kg:v});
    save(); buzz(); render(); toast('Peso salvo');
  },
  delWeight(t){ if(!confirm('Remover este registro de peso?')) return; S.weights[S.active]=S.weights[S.active].filter(w=>w.d!==t.dataset.v); save(); render(); },
  delCustom(t){ if(!confirm('Remover este alimento da sua lista?')) return; S.custom=S.custom.filter(c=>c.id!==t.dataset.id); save(); render(); },
  async export(){
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}), name=`dieta-backup-${prof().name}-${todayKey()}.json`;
    const file=new File([blob],name,{type:'application/json'});
    try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Backup Dieta a Dois'}); return; } }catch(e){ if(e.name==='AbortError') return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  },
  import(){ document.getElementById('importFile').click(); },
  reset(){ if(confirm('Apagar TODOS os dados deste celular? Isso não tem volta.') && confirm('Tem certeza mesmo?')){ S=defaults(); save(); UI.view='hoje'; render(); } },
  closeSheet(){ closeSheet(); },
};

/* ================= Introdução (primeira vez, ou em Ajustes) ================= */

  const pr=prof(), C=2*Math.PI*34;
  return [
    {art:`<img class="logo" src="icons/icon-192.png" alt="" style="width:110px;height:110px;border-radius:30px">`,
     t:`Oi, ${h(pr.name)}!`, d:'Este app conta as <b>calorias</b> e a <b>proteína</b> do seu dia seguindo o plano de vocês. Em 1 minuto você aprende tudo.'},
    {art:`<div class="mock"><div class="summary" style="gap:14px"><div class="ring" style="width:84px;height:84px"><svg width="84" height="84" viewBox="0 0 84 84" style="transform:rotate(-90deg)"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--soft)" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*.38}"/></svg><div class="c"><b style="font-size:17px">${R(pr.kcal*.38)}</b></div></div>
       <div class="grow" style="display:grid;gap:10px"><div class="mstat"><div class="row between"><span class="ttl">${ic('dumbbell',14)}Proteína</span></div><div class="bar thin"><i style="width:55%"></i></div></div>
       <div class="mstat water"><div class="row between"><span class="ttl">${ic('droplet',14)}Água</span></div><div class="bar thin"><i style="width:35%"></i></div></div></div></div></div>`,
     t:'Seu dia num olhar', d:'O anel mostra <b>quantas calorias ainda cabem</b> hoje. Ao lado ficam a proteína e a água. Bebeu um copo? Toque em <b>“+ 1 copo”</b>.'},
    {art:`<div class="mock"><div class="fakesearch">${ic('search',16)}<b>C5</b></div><div class="entry"><div class="grow"><div class="n"><span class="code">C5</span>Rap10 de frango</div></div><div class="kc">${R(PLAN[4].k[P()])}</div></div></div><div class="bigfab">${ic('plus',30)}</div>`,
     t:'Adicionar comida', d:'Toque no <b>+</b> do meio da barra de baixo, ou no + de uma refeição. Busque pelo nome ou pelo <b>código do plano</b> (ex: C5) e ajuste a quantidade.'},
    {art:`<div style="display:flex;gap:10px"><div class="sug"><span class="top2"><span class="k">Café · C6</span><span class="k">${R(PLAN[5].k[P()])}</span></span>Tapioca de frango</div><div class="sug done"><span class="top2"><span class="k">Almoço · A1</span>${ic('check',16)}</span>Frango grelhado</div></div>`,
     t:'Sugestões do plano', d:'A tela Hoje mostra as opções do plano pro dia. <b>Um toque</b> e ela já vem na sua porção, com as calorias certas.'},
    {art:`<div class="mock"><div class="fakesearch" style="align-items:flex-start;line-height:1.4">${ic('calculator',16)}<span>“200g de frango cru, 1 colher de azeite, 1 cebola e 2 rap10”</span></div><div class="row between" style="padding:8px 4px 0"><span class="muted small">Total calculado</span><b style="font-size:22px;color:var(--accent)">≈ 620 kcal</b></div></div>`,
     t:'Calculadora de prato', d:'Fez algo diferente? No +, escolha <b>Calculadora</b> e escreva o que usou. Ela soma tudo e divide em porções se cozinharem juntos.'},
    {art:`<div class="mock"><div class="entry"><span class="tapdot"></span><div class="grow"><div class="n">Frango grelhado</div><div class="muted small">1 porção</div></div><div class="kc">${R(PLAN[8].k[P()])}</div></div></div><div class="arrowtxt">${ic('chevD',18)}Arraste pra baixo pra fechar</div>`,
     t:'Mudar ou apagar', d:'Toque numa comida já lançada pra <b>mudar a quantidade</b> ou remover. Pra fechar uma janela: <b>arraste pra baixo</b>, toque fora ou no X.'},
    {art:`<div class="mock"><svg viewBox="0 0 300 110" width="100%"><path d="M10 25 L80 38 L150 52 L220 70 L290 84 L290 105 L10 105 Z" fill="var(--accent)" opacity=".1"/><polyline points="10,25 80,38 150,52 220,70 290,84" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${[[10,25],[80,38],[150,52],[220,70],[290,84]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>`).join('')}</svg></div>`,
     t:'Acompanhe o progresso', d:'Na aba <b>Progresso</b>, registre seu peso (de manhã, em jejum) e veja o gráfico e a média de calorias da semana.'},
    {art:`<div class="bigcheck">${ic('check',48)}</div>`,
     t:'Tudo pronto!', d:'Seus dados ficam só neste celular. De vez em quando faça um <b>backup em Ajustes</b> — lá também dá pra rever esta introdução.'},
  ];
}
function showIntro(){
  const steps=introSteps(); let i=0;
  document.getElementById('intro')?.remove();
  const el=document.createElement('div'); el.id='intro'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Introdução');
  el.innerHTML=`<div class="in-top"><span class="muted small" id="inCount"></span><button class="link" data-a="introEnd">Pular</button></div>
    <div class="in-view"><div class="in-track">${steps.map(s=>`<div class="in-slide"><div class="in-in"><div class="in-art">${s.art}</div><h2>${s.t}</h2><p>${s.d}</p></div></div>`).join('')}</div></div>
    <div class="in-dots">${steps.map(()=>'<i></i>').join('')}</div>
    <div class="in-btns"><button class="btn ghost" id="inPrev">Voltar</button><button class="btn" id="inNext"></button></div>`;
  document.body.appendChild(el); document.body.style.overflow='hidden';
  const track=el.querySelector('.in-track'), dots=el.querySelectorAll('.in-dots i'), prev=el.querySelector('#inPrev'), next=el.querySelector('#inNext');
  const go=n=>{ i=Math.max(0,Math.min(steps.length-1,n)); track.style.transform=`translateX(${-i*100}%)`;
    dots.forEach((d,j)=>d.classList.toggle('on',j===i)); el.querySelector('#inCount').textContent=`${i+1} de ${steps.length}`;
    prev.style.display=i?'':'none'; next.textContent=i===steps.length-1?'Começar':'Próximo'; };
  prev.onclick=()=>go(i-1);
  next.onclick=()=>i===steps.length-1?A.introEnd():go(i+1);
  let x0=null; const view=el.querySelector('.in-view');
  view.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  view.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(dx<-45) go(i+1); else if(dx>45) go(i-1); });
  go(0);
}
Object.assign(A,{
  intro(){ showIntro(); },
  introEnd(){ S.introSeen=true; save(); const el=document.getElementById('intro'); if(!el) return; el.classList.add('out'); document.body.style.overflow=''; setTimeout(()=>el.remove(),260); },
});

document.addEventListener('click',e=>{ const t=e.target.closest('[data-a]'); if(!t||t.tagName==='INPUT') return; const f=A[t.dataset.a]; f&&f(t,e); });
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.a==='setProf'){ const k=t.dataset.k, pr=prof(); pr[k]=t.type==='number'?(parseFloat(t.value.replace(',','.'))||pr[k]):(t.value.trim()||pr[k]); save(); render(); toast('Salvo'); }
  if(t.id==='qu'){ document.getElementById('qgW').hidden=t.value!=='g'; }
  if(t.id==='importFile' && t.files[0]){
    t.files[0].text().then(txt=>{ const s=JSON.parse(txt); if(!s.profiles||!s.days) throw 0;
      if(confirm('Substituir os dados deste celular pelo backup?')){ S=Object.assign(defaults(),s); save(); render(); toast('Backup restaurado'); } })
      .catch(()=>toast('Arquivo de backup inválido',false)).finally(()=>t.value='');
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='wIn') A.addWeight(); if(e.key==='Escape') closeSheet(); });
// Atualiza "hoje" quando o app volta do segundo plano num dia novo
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return; const t=todayKey();
  if(t!==UI.lastToday){ if(UI.date===UI.lastToday) UI.date=t; UI.lastToday=t; if(!sheetOpen) render(); }
});

document.querySelectorAll('[data-ic]').forEach(el=>el.innerHTML=ic(el.dataset.ic, +(el.dataset.ics||23)));
render();
if(S.active && !S.introSeen) showIntro();
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
